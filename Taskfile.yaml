version: "3"

tasks:
  update:
    desc: "Update dependencies for {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - echo "Updating dependencies for {{ .CLI_ARGS }} chart"
      - helm dependency update

  update-all:
    desc: "Update dependencies for all charts"
    silent: true
    cmds:
      - printf "\nUpdating dependencies for all charts. \n\n"
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ]; then
            chart_name=$(basename "$chart")

            # Only run if chart has dependencies and needs updating
            if grep -q "dependencies:" "$chart/Chart.yaml"; then
              if [ ! -f "$chart/Chart.lock" ] || [ ! -d "$chart/charts" ]; then
                echo "Initial dependency update for $chart_name"
                task update -- "$chart_name"
              else
                # Get hash of dependencies section
                deps_hash=$(awk '/dependencies:/{flag=1} flag && /^[^ ]/{exit} flag' "$chart/Chart.yaml" | sha256sum | cut -d' ' -f1)

                # Check if hash changed
                if [ ! -f "$chart/.deps-hash" ] || [ "$deps_hash" != "$(cat "$chart/.deps-hash" 2>/dev/null)" ]; then
                  task update -- "$chart_name"
                  echo "$deps_hash" > "$chart/.deps-hash"
                else
                  echo "Skipping $chart_name - dependencies unchanged"
                fi
              fi
            else
              echo "Skipping $chart_name - no dependencies"
            fi
          fi
        done

  lint:
    desc: "Lint {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - helm lint .

  lint-all:
    desc: "Lint all charts"
    silent: true
    cmds:
      - printf "\nLinting all charts. \n\n"
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ]; then
            chart_name=$(basename "$chart")
            echo "Linting $chart_name..."
            if helm lint "$chart"; then
              echo "✓ $chart_name passed linting"
            else
              echo "✗ $chart_name failed linting"
            fi
            echo ""
          fi
        done

  docs:
    desc: "Generate documentation for {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - |
        if ! command -v helm-docs &> /dev/null; then
          echo "helm-docs is not installed. Install it with: brew install helm-docs"
          echo "Or download from: https://github.com/norwoodj/helm-docs/releases"
          exit 1
        fi
      - helm-docs .
      - echo "Generated README.md for {{ .CLI_ARGS }}"

  docs-all:
    desc: "Generate documentation for all charts"
    silent: true
    cmds:
      - |
        if ! command -v helm-docs &> /dev/null; then
          echo "helm-docs is not installed. Install it with:"
          echo "  brew install helm-docs"
          echo "  # or"
          echo "  go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest"
          exit 1
        fi
      - printf "\nGenerating documentation for all charts. \n\n"
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ]; then
            chart_name=$(basename "$chart")
            echo "Generating docs for $chart_name..."
            (cd "$chart" && helm-docs .)
          fi
        done

  docs-init:
    desc: "Initialize helm-docs template for {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - |
        cat > README.md.gotmpl << 'EOF'
        {{ template "chart.header" . }}
        {{ template "chart.deprecationWarning" . }}

        {{ template "chart.badgesSection" . }}

        {{ template "chart.description" . }}

        {{ template "chart.homepageLine" . }}

        ## Installing the Chart

        To install the chart with the release name `my-{{ template "chart.name" . }}`:

        ```console
        helm install my-{{ template "chart.name" . }} -n my-namespace jshimko/{{ template "chart.name" . }}
        ```

        ## Uninstalling the Chart

        ```console
        helm delete my-{{ template "chart.name" . }}
        ```

        {{ template "chart.maintainersSection" . }}

        {{ template "chart.sourcesSection" . }}

        {{ template "chart.requirementsSection" . }}

        {{ template "chart.valuesSection" . }}

        ## Configuration

        The following table lists the configurable parameters and their default values.

        {{ template "chart.valuesTable" . }}

        Specify each parameter using the `--set key=value[,key=value]` argument to `helm install`.

        Alternatively, a YAML file that specifies the values for the parameters can be provided while installing the chart. For example:

        ```console
        helm install my-{{ template "chart.name" . }} -n my-namespace jshimko/{{ template "chart.name" . }} -f values.yaml
        ```
        EOF
      - echo "Created README.md.gotmpl template for {{ .CLI_ARGS }}"

  package:
    desc: "Package {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - helm package . --destination ../../dist/

  package-all:
    desc: "Package all charts"
    deps: [update-all]
    cmds:
      - mkdir -p dist
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ]; then
            chart_name=$(basename "$chart")
            echo "Packaging $chart_name..."
            helm package "$chart" --destination dist/
          fi
        done

  template:
    desc: "Render templates for {{ .CLI_ARGS }} chart"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - helm template . {{ if .VALUES }}--values {{ .VALUES }}{{ end }}

  clean:
    desc: "Clean generated files"
    cmds:
      - rm -rf charts/*/charts
      - rm -f charts/*/.deps-hash
      - rm -f charts/*/Chart.lock
      - rm -rf dist/
      - echo "Cleaned all generated files"

  version:
    desc: "Show version of {{ .CLI_ARGS }} chart"
    silent: true
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - |
        chart_version=$(grep '^version:' Chart.yaml | awk '{print $2}')
        app_version=$(grep '^appVersion:' Chart.yaml | awk '{print $2}')
        echo "{{ .CLI_ARGS }}: chart=$chart_version, app=$app_version"

  versions:
    desc: "Show versions of all charts"
    silent: true
    cmds:
      - printf "\nChart versions:\n\n"
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ]; then
            chart_name=$(basename "$chart")
            task version -- "$chart_name"
          fi
        done

  bump-version:
    desc: "Bump version of {{ .CLI_ARGS }} chart (use TYPE=major|minor|patch)"
    dir: charts/{{ .CLI_ARGS }}
    vars:
      TYPE: '{{ .TYPE | default "patch" }}'
    cmds:
      - |
        current_version=$(grep '^version:' Chart.yaml | awk '{print $2}')
        IFS='.' read -r major minor patch <<< "$current_version"

        case "{{ .TYPE }}" in
          major)
            new_version="$((major + 1)).0.0"
            ;;
          minor)
            new_version="${major}.$((minor + 1)).0"
            ;;
          patch)
            new_version="${major}.${minor}.$((patch + 1))"
            ;;
        esac

        sed -i.bak "s/^version: .*/version: $new_version/" Chart.yaml
        rm Chart.yaml.bak
        echo "Bumped {{ .CLI_ARGS }} from $current_version to $new_version"

  validate:
    desc: "Validate {{ .CLI_ARGS }} chart with values file"
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - |
        if [ -f "{{ .VALUES | default "values.yaml" }}" ]; then
          helm template . --values {{ .VALUES | default "values.yaml" }} --debug --dry-run
        else
          echo "Values file not found: {{ .VALUES | default "values.yaml" }}"
          exit 1
        fi

  deps-tree:
    desc: "Show dependency tree for {{ .CLI_ARGS }} chart"
    silent: true
    dir: charts/{{ .CLI_ARGS }}
    cmds:
      - |
        if [ -f Chart.lock ]; then
          echo "Dependencies for {{ .CLI_ARGS }}:"
          cat Chart.lock | grep -E "name:|version:|repository:" | sed 's/^/  /'
        else
          echo "No dependencies found for {{ .CLI_ARGS }}"
        fi

  install-tools:
    desc: "Install helpful Helm plugins"
    cmds:
      - helm plugin install https://github.com/databus23/helm-diff || true
      - helm plugin install https://github.com/jkroepke/helm-secrets || true
      - helm plugin install https://github.com/chartmuseum/helm-push || true
      - echo "Helm plugins installed"
