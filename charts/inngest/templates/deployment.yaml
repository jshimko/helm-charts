{{/*
Inngest Main Application Deployment
This template creates the primary Inngest application deployment which includes:
- Main Inngest container running the event-driven platform
- Optional Prometheus sidecar for KEDA autoscaling (when keda.enabled=true)
- Security contexts for non-root execution and read-only filesystem
- Health checks for liveness and readiness probes

The deployment uses consistent naming ("inngest") regardless of Helm release name
to ensure predictable resource references across environments.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inngest.fullname" . }}
  labels:
    {{- include "inngest.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.keda.enabled }}
  # Static replica count when KEDA is disabled
  # When KEDA is enabled, it manages the replica count dynamically
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inngest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "inngest.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "inngest.serviceAccountName" . }}

      # Pod-level security context - runs as non-root user for security
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: check-db-connection
          image: postgres:latest
          env:
            - name: INNGEST_POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgres.cluster.name }}-postgres-app"
                  key: "uri"
          command: ['sh', '-c', 'until pg_isready -d $INNGEST_POSTGRES_URI; do echo waiting for database; sleep 2; done;']
      {{- end }}

      containers:
        # Main Inngest application container
        - name: inngest

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Start the Inngest server process
          command: ["inngest", "start"]

          ports:
            # Main Inngest API and UI port (8288)
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # Inngest Connect service port for function registration (8289)
            - name: connect
              containerPort: {{ .Values.service.connPort }}
              protocol: TCP
            # Connect internal gRPC coordination ports (gateway <-> executor
            # routing between replicas)
            - name: grpc-gateway
              containerPort: {{ .Values.inngest.connectGatewayGrpcPort }}
              protocol: TCP
            - name: grpc-executor
              containerPort: {{ .Values.inngest.connectExecutorGrpcPort }}
              protocol: TCP

          # Container-level security context - read-only filesystem, dropped capabilities
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          env:
            - name: INNGEST_DEV
              value: "0"

            # telemetry opt-out
            - name: DO_NOT_TRACK
              value: "1"

            # Server configuration
            {{- if .Values.inngest.config }}
            - name: INNGEST_CONFIG
              value: {{ .Values.inngest.config | quote }}
            {{- end }}

            {{- if .Values.inngest.host }}
            - name: INNGEST_HOST
              value: {{ .Values.inngest.host | quote }}
            {{- end }}

            - name: INNGEST_PORT
              value: {{ .Values.inngest.port | quote }}
            - name: INNGEST_CONNECT_GATEWAY_PORT
              value: {{ .Values.inngest.connectGatewayPort | quote }}
            - name: INNGEST_CONNECT_GATEWAY_GRPC_PORT
              value: {{ .Values.inngest.connectGatewayGrpcPort | quote }}
            - name: INNGEST_CONNECT_EXECUTOR_GRPC_PORT
              value: {{ .Values.inngest.connectExecutorGrpcPort | quote }}

            {{- if .Values.inngest.sdkUrl }}
            - name: INNGEST_SDK_URL
              value: {{ join "," .Values.inngest.sdkUrl | quote }}
            {{- end }}

            {{- if .Values.inngest.noUI }}
            - name: INNGEST_NO_UI
              value: "true"
            {{- end }}

            - name: INNGEST_POLL_INTERVAL
              value: {{ .Values.inngest.pollInterval | quote }}
            - name: INNGEST_QUEUE_WORKERS
              value: {{ .Values.inngest.queueWorkers | quote }}
            - name: INNGEST_RETRY_INTERVAL
              value: {{ .Values.inngest.retryInterval | quote }}
            - name: INNGEST_TICK
              value: {{ .Values.inngest.tick | quote }}

            # Logging - the server's logger reads the plain LOG_LEVEL env var
            # (INNGEST_LOG_LEVEL is not honored). Logs are always JSON
            # in-cluster because stdout is not a TTY.
            - name: LOG_LEVEL
              value: {{ .Values.inngest.logLevel | quote }}

            {{- if .Values.inngest.experimentalPromMetrics }}
            # Per-function Prometheus lifecycle counters on /metrics
            - name: INNGEST_EXPERIMENTAL_PROM_METRICS
              value: "1"
            {{- end }}

            # postgres - operator-managed CNPG cluster, or an external database
            # via inngest.postgres.uriSecretRef / inngest.postgres.uri (the
            # literal URI flows in through inngest-secret via envFrom)
            {{- if .Values.postgres.enabled }}
            - name: INNGEST_POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgres.cluster.name }}-postgres-app"
                  key: "uri"
            {{- else if .Values.inngest.postgres.uriSecretRef.name }}
            - name: INNGEST_POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inngest.postgres.uriSecretRef.name | quote }}
                  key: {{ .Values.inngest.postgres.uriSecretRef.key | quote }}
            {{- end }}
            {{- if or .Values.postgres.enabled .Values.inngest.postgres.uriSecretRef.name .Values.inngest.postgres.uri }}
            # Postgres connection pool tuning
            - name: INNGEST_POSTGRES_MAX_IDLE_CONNS
              value: {{ .Values.inngest.postgres.maxIdleConns | quote }}
            - name: INNGEST_POSTGRES_MAX_OPEN_CONNS
              value: {{ .Values.inngest.postgres.maxOpenConns | quote }}
            - name: INNGEST_POSTGRES_CONN_MAX_IDLE_TIME
              value: {{ .Values.inngest.postgres.connMaxIdleTime | quote }}
            - name: INNGEST_POSTGRES_CONN_MAX_LIFETIME
              value: {{ .Values.inngest.postgres.connMaxLifetime | quote }}
            {{- end }}

            # redis - operator-managed instance, or an external Redis via
            # inngest.redis.uriSecretRef / inngest.redis.uri (the literal URI
            # flows in through inngest-secret via envFrom)
            {{- if .Values.redis.enabled }}
            - name: INNGEST_REDIS_URI
              value: "redis://{{ .Values.redis.name }}:6379"
            {{- else if .Values.inngest.redis.uriSecretRef.name }}
            - name: INNGEST_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inngest.redis.uriSecretRef.name | quote }}
                  key: {{ .Values.inngest.redis.uriSecretRef.key | quote }}
            {{- end }}

            {{- if .Values.inngest.sqlite.dir }}
            - name: INNGEST_SQLITE_DIR
              value: {{ .Values.inngest.sqlite.dir | quote }}
            {{- end }}

          # additional custom env
          {{- with .Values.inngest.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

          envFrom:
            # Sensitive configuration (event keys, signing keys)
            - secretRef:
                name: inngest-secret
            # additional custom envFrom
          {{- with .Values.inngest.envFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # Volume mounts for writable directories (required for read-only filesystem)
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: inngest-data
              mountPath: /data

        {{- if .Values.keda.enabled }}
        # Prometheus sidecar container - scrapes Inngest metrics for KEDA autoscaling
        # This container runs alongside the main Inngest container and provides
        # a Prometheus-compatible API that KEDA can query for scaling decisions
        - name: prometheus-sidecar
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          ports:
            # Prometheus API port for KEDA to query metrics
            - name: prometheus
              containerPort: 9090
              protocol: TCP
          # Prometheus server configuration
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus/
            - --storage.tsdb.retention.time=1h  # Short retention for sidecar use
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles
            - --web.enable-lifecycle
            - --web.listen-address=0.0.0.0:9090
          volumeMounts:
            # Prometheus configuration from ConfigMap
            - name: prometheus-config
              mountPath: /etc/prometheus
            # Inngest signing key for authenticated metrics scraping
            - name: inngest-signing-key
              mountPath: /etc/secrets
            # Writable volumes for Prometheus data (required for read-only filesystem)
            - name: prometheus-data
              mountPath: /prometheus
            - name: prometheus-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
        {{- end }}

      volumes:
        # Temporary volumes required for read-only root filesystem security
        # These provide writable space for applications that need it
        - name: tmp-volume
          emptyDir: {}
        - name: inngest-data
          emptyDir: {}
        {{- if .Values.keda.enabled }}
        # KEDA Prometheus sidecar configuration
        - name: prometheus-config
          configMap:
            name: {{ include "inngest.fullname" . }}-prometheus-config
        # Inngest signing key secret for Prometheus authentication
        - name: inngest-signing-key
          secret:
            secretName: inngest-secret
            items:
              - key: INNGEST_SIGNING_KEY
                path: inngest-signing-key
        # Writable volumes for Prometheus sidecar (read-only filesystem requirement)
        - name: prometheus-data
          emptyDir: {}
        - name: prometheus-tmp
          emptyDir: {}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
