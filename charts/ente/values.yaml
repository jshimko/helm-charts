# Default values for Ente Photos
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of the release
fullnameOverride: ""

# -- Additional labels for all resources
commonLabels: {}

# -- Additional annotations for all resources
commonAnnotations: {}

# -- Image pull secrets for private registries
imagePullSecrets: []

# Shared configuration for all Ente services
sharedConfig:
  env: []
  envFrom: []

# =============================================================================
# MUSEUM SERVER CONFIGURATION (Main API Server)
# =============================================================================
museum:
  # -- Museum server image configuration
  image:
    # -- Museum server image repository
    repository: ghcr.io/ente-io/server
    # -- Museum server image tag (defaults to "latest")
    tag: ""
    # -- Museum server image pull policy
    pullPolicy: IfNotPresent

  # -- Number of Museum server replicas
  replicaCount: 1

  # -- Museum server container resource requests and limits
  resources: {}
    # requests:
    #   cpu: 200m
    #   memory: 256Mi
    # limits:
    #   cpu: 1000m
    #   memory: 1Gi

  # -- Additional environment variables for Museum server
  env: []
    # - name: CUSTOM_VAR
    #   value: "custom-value"

  # -- Additional environment variables from ConfigMaps or Secrets
  envFrom: []
    # - configMapRef:
    #     name: extra-config
    # - secretRef:
    #     name: extra-secrets

  # -- Additional volume mounts for Museum server
  extraVolumeMounts: []

  # -- Additional volumes for Museum server
  extraVolumes: []

  # -- Init containers for Museum server
  initContainers: []

  # -- Security context for Museum server container
  securityContext: {}
    # runAsNonRoot: true
    # runAsUser: 65534
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    # capabilities:
    #   drop:
    #     - ALL

  # -- Pod security context for Museum server
  podSecurityContext:
    fsGroup: 65534
    # runAsNonRoot: true
    # seccompProfile:
    #   type: RuntimeDefault

  # -- Pod annotations for Museum server
  podAnnotations: {}

  # -- Pod labels for Museum server
  podLabels: {}

  # -- Node selector for Museum server
  nodeSelector: {}

  # -- Tolerations for Museum server
  tolerations: []

  # -- Affinity rules for Museum server
  affinity: {}

  # -- Topology spread constraints for Museum server
  topologySpreadConstraints: []

  # -- Priority class name for Museum server
  priorityClassName: ""

  # -- Termination grace period in seconds
  terminationGracePeriodSeconds: 30

  # -- Service account configuration
  serviceAccount:
    # -- Create service account
    create: false
    # -- Annotations for service account
    annotations: {}
    # -- Service account name
    name: "ente-museum"
    # -- Automount service account token
    automount: true

  # -- Update strategy for Museum deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Persistence for Museum server
  persistence:
    data:
      # -- Enable data persistence
      enabled: false
      # -- Storage class for data PVC
      storageClass: ""
      # -- Access modes for data PVC
      accessModes:
        - ReadWriteOnce
      # -- Storage size for data
      size: 1Gi
      # -- Annotations for data PVC
      annotations: {}

  # Museum service configuration
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 3000
    # -- Service target port
    targetPort: 8080
    # -- Service annotations
    annotations: {}
    # -- Load balancer IP (for LoadBalancer type)
    loadBalancerIP: ""
    # -- Load balancer source ranges
    loadBalancerSourceRanges: []
    # -- External IPs
    externalIPs: []
    # -- Node port (for NodePort type)
    nodePort: ""

  # Museum ingress configuration
  ingress:
    # -- Enable ingress for Museum API
    enabled: false
    # -- Ingress class name
    className: nginx
    # -- Ingress annotations
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # -- Ingress hosts configuration
    hosts:
      - host: api.ente.local
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration
    tls: []
      # - secretName: ente-api-tls
      #   hosts:
      #     - api.ente.local

  # -- Startup probe configuration
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 5
    periodSeconds: 2
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 60 # give up and force restart after 2 minutes

  # -- Readiness probe configuration
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # -- Liveness probe configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3


