# =============================================================================
# METRICS & MONITORING CONFIGURATION
# =============================================================================
metrics:
  # -- Enable Prometheus metrics endpoint
  enabled: false
  # -- Metrics port
  port: 2112

  # ServiceMonitor configuration (for prometheus-operator)
  serviceMonitor:
    # -- Enable ServiceMonitor
    enabled: true
    # -- ServiceMonitor namespace (defaults to release namespace)
    namespace: ""
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Metrics path
    path: /metrics
    # -- Scheme (http or https)
    scheme: http
    # -- Additional labels for ServiceMonitor
    labels: {}
    # -- Annotations for ServiceMonitor
    annotations: {}
    # -- TLS configuration for ServiceMonitor
    tlsConfig: {}
    # -- Relabelings for ServiceMonitor
    relabelings: []
    # -- Metric relabelings for ServiceMonitor
    metricRelabelings: []

# Postgres Cluster
# https://cloudnative-pg.io/
cnpg:
  enabled: true

  # -- Init container to detect if the database is ready before starting the app
  initContainer:
    enabled: true
    image: postgres:latest

  cluster:
    name: postgres-ente-photos

    labels:
    annotations:

    spec:
      instances: 1

      bootstrap:
        initdb:
          database: ente-photos
          owner: ente-photos

      storage:
        size: 10Gi

      walStorage:
        size: 10Gi

  pooler:
    enabled: false
    instances: 1

    labels:
    annotations:

    type: rw

    pgbouncer:
      poolMode: transaction
      parameters:
        max_client_conn: "1000"
        default_pool_size: "10"

  backups:
    enabled: false

    labels:
    annotations:

    schedule: "0 0 0 * * *" # every day at midnight UTC
    retentionPolicy: "30d"

    # https://cloudnative-pg.io/plugin-barman-cloud/docs/object_stores/#s3-compatible-storage-providers
    config: {}
      # endpointURL: https://s3.us-west-002.backblazeb2.com
      # destinationPath: s3://pianobase-cnpg/backups/local-dev/
      # s3Credentials:
      #   accessKeyId:
      #     name: cnpg-s3-creds
      #     key: ACCESS_KEY_ID
      #   secretAccessKey:
      #     name: cnpg-s3-creds
      #     key: ACCESS_SECRET_KEY

extraTemplates: []
