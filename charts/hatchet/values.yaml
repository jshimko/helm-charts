  #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.1.0
  #   args:
  #     - "--private-ip"
  #     - "--structured-logs"
  #     - "--port=5432"
  #     - "hatchet-1:us-central1:hatchet"
  #   securityContext:
  #     runAsNonRoot: true
  #   resources:
  #     limits:
  #       memory: 512Mi
  #     requests:
  #       cpu: 500m
  #       memory: 512Mi

  strategy:
    type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  annotations: {}
  labels: {}

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    {}
    # fsGroup: 2000

  securityContext:
    {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
    labels: {}

  # https://docs.hatchet.run/self-hosting/networking
  ingress:
    enabled: false
    className: ""
    annotations:
      {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
