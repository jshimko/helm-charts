# Default values for hatchet.

# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# Override the chart name.
nameOverride: ""
fullnameOverride: ""

# Shared configuration for all Hatchet services
# eg. SERVER_URL, SERVER_AUTH_COOKIE_DOMAIN, etc.
sharedConfig:
  env:
    - name: SERVER_DEFAULT_ENGINE_VERSION
      value: "V1"
    # - name: SERVER_URL
    #   value: "http://localhost:8080"
  envFrom: []

# Hatchet API Service
api:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/hatchet-dev/hatchet/hatchet-api
    pullPolicy: IfNotPresent
    tag: "" # defaults to Chart.AppVersion

  # Command and arguments
  command: ["/hatchet/hatchet-api"]
  args: []

  env: []
  # - name: FOO
  #   value: "BAR"
  # - name: FOO
  #   valueFrom:
  #     configMapKeyRef:
  #       name: my-configmap
  #       key: foo
  # - name: FOO
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: foo

  envFrom: []
