# Hatchet Jobs Configuration
jobs:
  # Migration Job - runs database migrations
  migration:
    enabled: true

    image:
      repository: ghcr.io/hatchet-dev/hatchet/hatchet-migrate
      tag: "" # defaults to Chart.AppVersion
      pullPolicy: IfNotPresent

    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: "-10" # ensure this job runs before everything else
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # Job configuration
    restartPolicy: Never
    backoffLimit: 1
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 86400

    # Command and arguments
    command: ["/bin/sh", "-c"]
    args: [./atlas-apply.sh]

    # Environment variables
    env: []
    envFrom: []
    useSharedEnv: true # use the globally shared environment variables template

    # Pod configuration
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}

    # Container security context
    securityContext:
      {}
      # capabilities:
      #   add:
      #     - SYS_PTRACE

    # Resources
    resources: {}

    # Volumes
    volumes: []
    volumeMounts: []

    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # ServiceAccount
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

  # Seed Job - seeds initial data
  seed:
    enabled: true

    image:
      repository: ghcr.io/hatchet-dev/hatchet/hatchet-admin
      tag: "" # defaults to Chart.AppVersion
      pullPolicy: IfNotPresent

    annotations:
      helm.sh/hook: pre-install
      helm.sh/hook-weight: "-9" # ensure this job runs after migrations
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # Job configuration
    restartPolicy: OnFailure
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 86400

    # Command and arguments
    # this command requires read-write access on the hatchet-config configmap
    command: ["/hatchet/hatchet-admin"]
    args: ["quickstart", "--skip", "certs", "--skip", "keys"]

    # Environment variables
    env: []
    envFrom: []
    useSharedEnv: true # use the globally shared environment variables template

    # Pod configuration
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}

    # Container security context
    securityContext:
      {}
      # capabilities:
      #   add:
      #     - SYS_PTRACE

    # Resources
    resources: {}

    # Volumes
    volumes: []
    volumeMounts: []

    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # ServiceAccount
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

  # Quickstart Job - initial data setup
  quickstart:
    enabled: true

    image:
      repository: ghcr.io/hatchet-dev/hatchet/hatchet-admin
      tag: "" # defaults to Chart.AppVersion
      pullPolicy: IfNotPresent

    annotations:
      helm.sh/hook: pre-install
      helm.sh/hook-weight: "-8"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # Job configuration
    restartPolicy: OnFailure
    backoffLimit: 3
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 86400

    # Command and arguments
    # this command requires read-write access on the hatchet-config configmap
    command: ["/hatchet/hatchet-admin"]
    args: [
        "k8s",
        "quickstart",
        "--namespace",
        "$(K8S_NAMESPACE)", # is automatically set within the job template
        "--overwrite=false",
      ]

    # Environment variables
    env: []
    envFrom: []
    useSharedEnv: true # use the globally shared environment variables template

    # Pod configuration
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    securityContext: {}

    # Resources
    resources: {}

    # Volumes
    volumes: []
    volumeMounts: []

    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # ServiceAccount
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

  # Worker Token Job - creates worker shared tokens
  workerToken:
    enabled: true

    image:
      repository: ghcr.io/hatchet-dev/hatchet/hatchet-admin
      tag: "" # defaults to Chart.AppVersion
      pullPolicy: IfNotPresent

    annotations:
      helm.sh/hook: pre-install
      helm.sh/hook-weight: "-5"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # Job configuration
    restartPolicy: OnFailure
    backoffLimit: 3
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 86400

    # Command and arguments
    command: ["/hatchet/hatchet-admin"]
    args: [
        "k8s",
        "create-worker-token",
        "--namespace",
        "$(K8S_NAMESPACE)", # is automatically set within the job template
      ]

    # Environment variables
    env: []
    envFrom: []
    useSharedEnv: true # use the globally shared environment variables template

    # Pod configuration
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}

    # Container security context
    securityContext:
      {}
      # capabilities:
      #   add:
      #     - SYS_PTRACE

    # Resources
    resources: {}

    # Volumes
    volumes: []
    volumeMounts: []

    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # ServiceAccount
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

