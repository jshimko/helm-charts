{{- if .Values.jobs.workerToken.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hatchet.fullname" . }}-worker-token
  labels:
    {{- include "hatchet.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-token
  {{- with .Values.jobs.workerToken.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.jobs.workerToken.backoffLimit }}
  backoffLimit: {{ . }}
  {{- end }}
  {{- with .Values.jobs.workerToken.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.jobs.workerToken.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.jobs.workerToken.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hatchet.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-token
        {{- with .Values.jobs.workerToken.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hatchet.fullname" . }}-worker-token
      {{- with .Values.jobs.workerToken.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ .Values.jobs.workerToken.restartPolicy }}
      containers:
        - name: worker-token
          {{- with .Values.jobs.workerToken.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.jobs.workerToken.image.repository }}:{{ .Values.jobs.workerToken.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.jobs.workerToken.image.pullPolicy }}
          {{- with .Values.jobs.workerToken.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.jobs.workerToken.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Set the namespace for the hatchet command to use
            - name: K8S_NAMESPACE
              value: "{{ .Release.Namespace }}"
            {{- if .Values.jobs.workerToken.useSharedEnv }}
            {{- include "hatchet.sharedEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.jobs.workerToken.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: hatchet-config
            {{- include "hatchet.sharedEnvFrom" . | nindent 12 }}
            {{- with .Values.jobs.workerToken.envFrom }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.jobs.workerToken.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.jobs.workerToken.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.jobs.workerToken.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.workerToken.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.workerToken.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.workerToken.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
