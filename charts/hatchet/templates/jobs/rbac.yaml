{{- range $jobName := list "migration" "seed" "quickstart" "workerToken" -}}
{{- if index $.Values.jobs $jobName "enabled" -}}
{{- $jobConfig := index $.Values.jobs $jobName -}}
{{- if eq $jobName "workerToken" -}}
{{- $jobName = "worker-token" -}}
{{- end }}
{{- if $jobConfig.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "hatchet.fullname" $ }}-{{ $jobName }}"
  labels:
    helm.sh/chart: {{ include "hatchet.chart" $ }}
    app.kubernetes.io/name: {{ include "hatchet.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- if $.Chart.AppVersion }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $jobName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"  # Create ServiceAccounts before Roles and Jobs
    {{- with $jobConfig.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ $jobConfig.serviceAccount.automount }}
---
{{- if ne $jobName "migration" -}}
# Role for jobs to write to configmaps and secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "hatchet.fullname" $ }}-{{ $jobName }}"
  labels:
    helm.sh/chart: {{ include "hatchet.chart" $ }}
    app.kubernetes.io/name: {{ include "hatchet.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $jobName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-19"  # Create Roles after ServiceAccounts but before jobs
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
# RoleBinding for jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "hatchet.fullname" $ }}-{{ $jobName }}"
  labels:
    helm.sh/chart: {{ include "hatchet.chart" $ }}
    app.kubernetes.io/name: {{ include "hatchet.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $jobName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-18"  # Create RoleBindings after Roles but before jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "hatchet.fullname" $ }}-{{ $jobName }}"
subjects:
- kind: ServiceAccount
  name: "{{ include "hatchet.fullname" $ }}-{{ $jobName }}"
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
